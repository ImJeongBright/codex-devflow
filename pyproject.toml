[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-devflow"
version = "0.1.0"
description = "Local Codex CLI development orchestration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-devflow = "codex_devflow.cli:main"

[tool.setuptools.packages.find]
include = ["codex_devflow*"]
